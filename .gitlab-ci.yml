stages:
  - test
  - docs

test:
  stage: test
  image: python:3.11
  script:
    - python --version
    - python -m pip install -r backend/requirements.txt
    - python -m compileall .
    - python backend/manage.py check
    - cd backend
    - python manage.py test --verbosity 2

docs:
  stage: docs
  image: python:3.11
  script:
    - pip install mkdocs mkdocs-material
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week
