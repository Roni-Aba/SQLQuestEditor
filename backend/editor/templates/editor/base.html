{% load static %}

<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}SQL Spell Quest Editor{% endblock %}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="{% static 'editor/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'editor/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'editor/css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'editor/css/forms.css' %}">

  {% block additional_css %}{% endblock %}
</head>

<body>
  {% include "editor/components/navbar/navbar.html" %}

  {% block content %}{% endblock %}
</body>
</html>
