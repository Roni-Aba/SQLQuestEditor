<span class="tag-neutral">
  <span class="tag-title">
    {{ title|default:"Ausrüstungsliste" }}
  </span>

  {% if show_remove|default:True %}
    {% if delete_url %}
      <form
        action="{{ delete_url }}"
        method="post"
        class="d-inline"
        data-confirm="Soll der Gegenstand „{{ title|force_escape }}“ wirklich entfernt werden?"
      >
        {% csrf_token %}

        <button
          type="submit"
          class="tag-btn tag-remove"
          aria-label="{{ title }} entfernen"
        >
          ×
        </button>
      </form>
    {% else %}
      <button
        type="button"
        class="tag-btn tag-remove"
        aria-label="{{ title }} entfernen"
      >
        ×
      </button>
    {% endif %}
  {% endif %}


  {% if show_edit|default:True %}
    {% if edit_url %}
      <a
        href="{{ edit_url }}"
        class="tag-btn"
        aria-label="{{ title }} bearbeiten"
      >
        <i
          class="bi bi-pencil"
          aria-hidden="true"
        ></i>
      </a>
    {% else %}
      <button
        type="button"
        class="tag-btn"
        aria-label="{{ title }} bearbeiten"
      >
        <i
          class="bi bi-pencil"
          aria-hidden="true"
        ></i>
      </button>
    {% endif %}
  {% endif %}
</span>
