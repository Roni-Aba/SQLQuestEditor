<span class="tag-neutral">
  <span class="tag-title">{{ title|default:"Ausrüstungsliste" }}</span>

  {% if show_remove|default:True %}
    <button type="button" class="tag-btn tag-remove" aria-label="Entfernen">
      ×
    </button>
  {% endif %}

  {% if show_edit|default:True %}
    <button type="button" class="tag-btn" aria-label="Bearbeiten">
      <i class="bi bi-pencil"></i>
    </button>
  {% endif %}
</span>
