<div class="d-flex align-items-center justify-content-between gap-2 w-100 rounded-3 bg-primary-subtle px-3 py-2">
  <span class="fw-semibold">
    {{ title }}
  </span>

  <div class="d-flex align-items-center gap-3">
    <button
      type="button"
      class="btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
      aria-label="{{ title }} löschen"
    >
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
      aria-label="{{ title }} bearbeiten"
    >
      <i class="bi bi-pencil" aria-hidden="true"></i>
    </button>
  </div>
</div>
