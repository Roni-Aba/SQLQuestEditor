<div class="table-item d-flex align-items-center justify-content-between gap-2 w-100 rounded-3 px-3 py-2">

  <span class="fw-semibold">
    {{ title }}
  </span>

  <div class="table-item__actions d-flex align-items-center gap-3">

    {% if delete_url %}
      <form
        action="{{ delete_url }}"
        method="post"
        class="d-inline"
        onsubmit="return confirm('Soll das Level „{{ title|escapejs }}“ wirklich gelöscht werden?');"
      >
        {% csrf_token %}

        <button
          type="submit"
          class="table-item__action btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
          aria-label="{{ title }} löschen"
        >
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </form>
    {% else %}
      <button
        type="button"
        class="table-item__action btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
        aria-label="{{ title }} löschen"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    {% endif %}

    {% if edit_url %}
      <a
        href="{{ edit_url }}"
        class="table-item__action btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
        aria-label="{{ title }} bearbeiten"
      >
        <i class="bi bi-pencil" aria-hidden="true"></i>
      </a>
    {% else %}
      <button
        type="button"
        class="table-item__action btn btn-link text-dark text-decoration-none p-0 fs-5 lh-1"
        aria-label="{{ title }} bearbeiten"
      >
        <i class="bi bi-pencil" aria-hidden="true"></i>
      </button>
    {% endif %}
  </div>
</div>
